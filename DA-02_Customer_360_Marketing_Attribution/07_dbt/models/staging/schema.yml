version: 2

models:
  - name: stg_crm_customers
    description: "Cleaned customers staging model"
    columns:
      - name: customer_id
        description: "Unique customer identifier"
        data_tests:
          - not_null
          - unique

      - name: customer_name
        data_tests:
          - not_null

      - name: email
        data_tests:
          - not_null

      - name: acquisition_channel
        data_tests:
          - not_null

  - name: stg_crm_orders
    description: "Cleaned orders staging model"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null

      - name: order_date
        data_tests:
          - not_null

      - name: order_amount
        data_tests:
          - not_null
  
  - name: stg_crm_order_items
    description: "Cleaned order items staging model"
    columns:
      - name: order_item_id
        data_tests:
          - not_null
          - unique

      - name: order_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: quantity
        data_tests:
          - not_null

      - name: unit_price
        data_tests:
          - not_null
  
  - name: stg_crm_products
    description: "Cleaned products staging model"
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

      - name: product_name
        data_tests:
          - not_null

      - name: category
        data_tests:
          - not_null

      - name: unit_cost
        data_tests:
          - not_null

      - name: unit_price
        data_tests:
          - not_null